<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fuego: #ff4757; --agua: #54a0ff; --planta: #7bed9f; --comp: #ef57ff;
            --bg: #020617; --sinnoh-blue: #0ea5e9; --sinnoh-ice: #e0f2fe;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            font-family: 'Rajdhani', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px;
            background-image: 
                radial-gradient(circle at 50% -20%, #1e3a8a 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #312e81 0%, transparent 40%);
            min-height: 100vh; overflow-x: hidden;
        }

        /* Efecto de Aurora Boreal sutil */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, transparent 30%, rgba(142, 214, 255, 0.05) 50%, transparent 70%);
            filter: blur(100px); z-index: -1; animation: aurora 15s infinite alternate;
        }

        @keyframes aurora { from { transform: translateX(-20%) rotate(-10deg); } to { transform: translateX(20%) rotate(10deg); } }

        .header-area { text-align: center; margin-bottom: 60px; padding-top: 20px; }
        .header-area h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--sinnoh-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 8px; filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.4));
        }

        .team-section { 
            background: var(--glass); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 35px; margin-bottom: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
        }

        .team-title { 
            font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 30px;
            color: var(--sinnoh-ice); display: flex; align-items: center; gap: 15px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .team-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--sinnoh-blue), transparent); }

        .poke-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; 
        }

        .poke-card {
            background: rgba(15, 23, 42, 0.6); border-radius: 16px; padding: 15px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05); text-align: center;
        }
        .poke-card:hover { 
            transform: translateY(-10px) scale(1.05);
            background: rgba(14, 165, 233, 0.1);
            border-color: var(--sinnoh-blue);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.2);
        }
        .poke-card img { width: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        .poke-card p { font-weight: 700; margin-top: 12px; font-size: 1rem; color: var(--sinnoh-ice); letter-spacing: 1px; }

        /* Modal Galáctico */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px);
        }
        .modal-content {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%); 
            margin: 8vh auto; padding: 40px; width: 90%; max-width: 480px; 
            border-radius: 32px; border: 1px solid var(--sinnoh-blue);
            text-align: center; position: relative;
        }
        .close { position: absolute; top: 20px; right: 25px; font-size: 30px; cursor: pointer; color: var(--sinnoh-blue); }

        .stat-bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; margin-top: 8px; }
        .stat-bar-fill { background: var(--sinnoh-blue); height: 100%; width: 0; border-radius: 10px; transition: width 1s; box-shadow: 0 0 10px var(--sinnoh-blue); }
        
        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
        .move-box { 
            background: rgba(14, 165, 233, 0.05); padding: 12px; border-radius: 12px; 
            font-size: 0.8rem; border: 1px solid rgba(14, 165, 233, 0.2); 
            font-weight: 600; color: #fff; text-transform: uppercase;
        }

        @media (max-width: 600px) { 
            .poke-grid { grid-template-columns: repeat(2, 1fr); }
            .header-area h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>SINNOH: DESAFIO CELESTIAL</h1>
        <p style="color: var(--sinnoh-blue); font-weight: 700; letter-spacing: 10px; margin-top: -5px;">LUCHA DE DIOSES</p>
    </div>

    <div id="wrapper"></div>

    <div id="pokeModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modalImg" style="width:180px; margin-top: -80px; filter: drop-shadow(0 0 25px var(--sinnoh-blue));">
            <h2 id="modalName" style="font-family: 'Orbitron'; font-size: 2rem; margin: 20px 0 5px 0; color: #fff;"></h2>
            <div id="modalType" style="font-weight: bold; color: var(--sinnoh-blue); margin-bottom: 25px; font-size: 0.9rem; letter-spacing: 3px;"></div>
            
            <div id="modalStats" style="text-align: left;"></div>
            <div class="moves-grid" id="modalMoves"></div>
        </div>
    </div>

    <script>
        const sinnohData = [
            { title: "TEAM INFERNAPE", color: "var(--fuego)", pokes: [
                ['Infernape', 392, 'FUEGO / LUCHA', '76,104,71,104,71,108', 'A Bocajarro, Envite Ígneo, Puño Trueno, Ida y Vuelta'],
                ['Staraptor', 398, 'NORMAL / VOLADOR', '85,120,70,50,60,100', 'A Bocajarro, Pájaro Osado, Ida y Vuelta, Retribución'],
                ['Luxray', 405, 'ELÉCTRICO', '80,120,79,95,79,70', 'Colmillo Rayo, Triturar, Chispa, Onda Voltio'],
                ['Roserade', 407, 'PLANTA / VENENO', '60,70,65,125,105,90', 'Bomba Lodo, Energibola, Somnífero, Extrasensorial'],
                ['Gastrodon', 423, 'AGUA / TIERRA', '111,83,68,92,82,39', 'Escaldar, Tierra Viva, Recuperación, Rayo Hielo'],
                ['Lucario', 448, 'LUCHA / ACERO', '70,110,70,115,70,90', 'Esfera Aural, Foco Resplandor, Pulso Umbrío, Veloc. Extrema']
            ]},
            { title: "TEAM EMPOLEON", color: "var(--agua)", pokes: [
                ['Empoleon', 395, 'AGUA / ACERO', '84,86,88,111,101,60', 'Hidrobomba, Foco Resplandor, Rayo Hielo, Surf'],
                ['Garchomp', 445, 'DRAGÓN / TIERRA', '108,130,95,80,85,102', 'Terremoto, Carga Dragón, Roca Afilada, Danza Espada'],
                ['Magmortar', 467, 'FUEGO', '75,95,67,125,95,83', 'Lanzallamas, Rayo, Psíquico, Onda Certera'],
                ['Electivire', 466, 'ELÉCTRICO', '75,123,67,95,85,95', 'Puño Trueno, Puño Hielo, Demolición, Tajo Cruzado'],
                ['Leafeon', 470, 'PLANTA', '65,110,130,60,65,95', 'Hoja Aguda, Danza Espada, Tijera X, Síntesis'],
                ['Honchkrow', 430, 'SINIESTRO / VOLADOR', '100,125,52,105,52,71', 'Tajo Umbrío, Persecución, Golpe Aéreo, Onda Ígnea']
            ]},
            { title: "TEAM TORTERRA", color: "var(--planta)", pokes: [
                ['Torterra', 389, 'PLANTA / TIERRA', '95,109,105,75,85,56', 'Terremoto, Martillazo, Roca Afilada, Síntesis'],
                ['Floatzel', 419, 'AGUA', '85,105,55,85,50,115', 'Cascada, Triturar, Puño Hielo, Acua Jet'],
                ['Gallade', 475, 'PSÍQ. / LUCHA', '68,125,65,65,115,80', 'Psicocorte, A Bocajarro, Hoja Aguda, Tajo Umbrío'],
                ['Drapion', 452, 'VENENO / SINIESTRO', '70,90,110,60,75,95', 'Veneno X, Triturar, Colmillo Ígneo, Púas'],
                ['Magnezone', 462, 'ELÉCT. / ACERO', '70,70,115,130,90,60', 'Rayo, Foco Resplandor, Triataque, Levitón'],
                ['Weavile', 461, 'SINIESTRO / HIELO', '70,120,65,45,85,125', 'Tajo Umbrío, Canto Helado, Demolición, Danza Espada']
            ]},
            { title: "TEAM COMPETITIVO", color: "var(--comp)", pokes: [
                ['Darkrai', 491, 'SINIESTRO', '70,90,90,135,90,125', 'Brecha Negra, Pulso Umbrío, Come Sueños, Rayo'],
                ['Togekiss', 468, 'HADA / VOLADOR', '85,50,95,120,115,80', 'Tajo Aéreo, Esfera Aural, Onda Trueno, Respiro'],
                ['Gliscor', 472, 'TIER. / VOLADOR', '75,95,125,45,75,95', 'Terremoto, Guillotina, Respiro, Colmillo Hielo'],
                ['Rotom-Wash', '10008', 'ELÉCT. / AGUA', '50,65,107,105,107,86', 'Hidrobomba, Rayo, Fuego Fatuo, Truco'],
                ['Porygon-Z', 474, 'NORMAL', '85,80,70,135,75,90', 'Triataque, Rayo, Rayo Hielo, Adaptación'],
                ['Spiritomb', 442, 'FANT. / SINIESTRO', '50,92,108,92,108,35', 'Pulso Umbrío, Fuego Fatuo, Sombra Vil, Mismo Destino']
            ]}
        ];

        function render() {
            const container = document.getElementById('wrapper');
            sinnohData.forEach(team => {
                let html = `
                <div class="team-section">
                    <div class="team-title">${team.title}</div>
                    <div class="poke-grid">`;
                team.pokes.forEach(p => {
                    html += `
                    <div class="poke-card" onclick="openPoke('${p[0]}','${p[1]}','${p[2]}','${p[3]}','${p[4]}')">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p[1]}.png">
                        <p>${p[0]}</p>
                    </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function openPoke(nombre, id, tipo, stats, movs) {
            document.getElementById('modalName').innerText = nombre;
            document.getElementById('modalType').innerText = tipo;
            document.getElementById('modalImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
            
            const labels = ['PS', 'ATK', 'DEF', 'SPA', 'SPD', 'VEL'];
            const values = stats.split(',');
            const statsDiv = document.getElementById('modalStats');
            statsDiv.innerHTML = "";
            values.forEach((v, i) => {
                statsDiv.innerHTML += `
                    <div style="margin-bottom:12px">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold; letter-spacing:1px; color: rgba(255,255,255,0.6)">
                            <span>${labels[i]}</span><span>${v}</span>
                        </div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(v/160)*100}%"></div></div>
                    </div>`;
            });

            const movesDiv = document.getElementById('modalMoves');
            movesDiv.innerHTML = "";
            movs.split(',').forEach(m => { movesDiv.innerHTML += `<div class="move-box">${m.trim()}</div>`; });

            document.getElementById('pokeModal').style.display = "block";
        }

        function closeModal() { document.getElementById('pokeModal').style.display = "none"; }
        render();
    </script>
</body>
</html>
