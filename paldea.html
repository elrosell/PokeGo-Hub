<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fuego: #ff4d4d; --agua: #4d94ff; --planta: #26de81; --comp: #a29bfe;
            --bg: #1a0a2a; --card-bg: rgba(255, 255, 255, 0.08); 
            --paldea-orange: #f39c12; --paldea-grape: #8e44ad;
            --tera: #00d2ff;
        }
        
        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: 20px;
            margin: 0; min-height: 100vh; overflow-y: auto;
            background-image: linear-gradient(180deg, #1a0a2a 0%, #2d144d 100%);
            background-attachment: fixed;
        }
        
        .header-area { text-align: center; margin-bottom: 40px; }
        .header-area h1 { 
            font-size: 2.8rem; font-weight: 900; letter-spacing: 2px; margin: 0;
            color: white; text-shadow: 3px 3px 0px var(--paldea-orange), -3px -3px 0px var(--paldea-grape);
        }

        .team-section { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 40px;
        }
        .team-title { 
            font-size: 1.4rem; margin-bottom: 20px; font-weight: 800; 
            text-transform: uppercase; border-bottom: 3px solid white; display: inline-block; 
        }

        .poke-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 15px; 
        }
        
        .poke-card {
            background: var(--card-bg); padding: 15px; border-radius: 20px; text-align: center;
            cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative; overflow: hidden;
        }
        .poke-card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.15); border-color: white; }
        .poke-card img { width: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4)); }

        .tera-badge {
            position: absolute; top: 0; left: 0; background: var(--tera); color: #000;
            font-size: 0.5rem; font-weight: 900; padding: 4px 10px;
            border-radius: 0 0 12px 0; letter-spacing: 1px;
            box-shadow: 0 0 10px var(--tera);
            z-index: 2;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            overflow-y: auto;
        }
        .modal-content {
            background: #fff; color: #1e272e; margin: 2% auto; padding: 30px; 
            width: 90%; max-width: 420px; border-radius: 35px; text-align: center;
            position: relative; animation: pop 0.4s ease;
            max-height: 90vh; overflow-y: auto;
        }
        
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close { position: absolute; top: 15px; right: 25px; font-size: 35px; cursor: pointer; color: #1e272e; font-weight: 800; }
        
        .stat-bar-bg { background: #f1f2f6; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 4px; }
        .stat-bar-fill { background: linear-gradient(90deg, var(--paldea-orange), var(--paldea-grape)); height: 100%; width: 0; transition: width 1s; }
        
        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
        .move-box { 
            background: #f1f2f6; color: #2f3542; padding: 6px 10px; border-radius: 8px; 
            font-size: 0.72rem; font-weight: 700; border: 1px solid #dcdde1;
        }

        @media (max-width: 1100px) { .poke-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .poke-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>PALDEA: SECRETO OSCURO</h1>
        <p>Batalla de la Academia</p>
    </div>

    <div id="teams-wrapper"></div>

    <div id="pokeModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modalImg" style="width:150px; margin-bottom: 10px;">
            <h2 id="modalName" style="margin: 0; font-weight: 900; text-transform: uppercase;"></h2>
            <p id="modalType" style="color:#747d8c; margin-bottom: 20px; font-weight: 600; text-transform: uppercase; font-size: 0.75rem;"></p>
            <div id="modalStats" style="text-align: left;"></div>
            <div class="moves-grid" id="modalMoves"></div>
        </div>
    </div>

    <script>
        const paldeaData = {
            'team-planta': {
                title: "🌿 Team Meowscarada", color: "var(--planta)",
                pokes: [
                    ['Meowscarada', 908, 'Planta/Siniestro', '76,110,70,81,70,123', 'Truco Floral, Tajo Umbrío, Ida y Vuelta, Carantoña', true],
                    ['Ceruledge', 937, 'Fuego/Fantasma', '75,125,80,60,100,85', 'Espada Lamento, Sombra Vil, A Bocajarro, Danza Espada', true],
                    ['Tinkaton', 959, 'Hada/Acero', '85,75,77,70,105,94', 'Martillo Gigante, Carantoña, Trampa Rocas, Onda Trueno', true],
                    ['Kilowattrel', 941, 'Eléctrico/Volador', '70,70,60,105,60,125', 'Vendaval, Rayo, Voltiocambio, Respiro', false],
                    ['Garganacl', 934, 'Roca', '100,100,130,45,90,35', 'Salazón, Recuperación, Plancha Corporal, Trampa Rocas', true],
                    ['Baxcalibur', 998, 'Hielo/Dragón', '115,145,92,75,86,87', 'Asalto Gélido, Garra Dragón, Danza Dragón, Terremoto', true]
                ]
            },
            'team-fuego': {
                title: "🔥 Team Skeledirge", color: "var(--fuego)",
                pokes: [
                    ['Skeledirge', 911, 'Fuego/Fantasma', '104,75,100,110,75,66', 'Canto Ardiente, Bola Sombra, Relajación, Tierra Viva', true],
                    ['Armarouge', 936, 'Fuego/Psíquico', '85,60,100,125,80,75', 'Cañón Armadura, Vastedad Psíquica, Paz Mental, Esfera Aural', true],
                    ['Annihilape', 979, 'Lucha/Fantasma', '110,115,80,50,90,90', 'Puño Furia, A Bocajarro, Corpulencia, Mofa', true],
                    ['Clodsire', 980, 'Veneno/Tierra', '130,75,60,45,100,20', 'Terremoto, Puya Nociva, Trampa Rocas, Recuperación', false],
                    ['Espathra', 956, 'Psíquico', '95,60,60,101,60,105', 'Choque Lumínico, Paz Mental, Protección, Brillo Mágico', true],
                    ['Dondozo', 977, 'Agua', '150,100,115,65,65,35', 'Invite Acuático, Cuerpo Pesado, Descanso, Sonámbulo', false]
                ]
            },
            'team-agua': {
                title: "💧 Team Quaquaval", color: "var(--agua)",
                pokes: [
                    ['Quaquaval', 914, 'Agua/Lucha', '85,120,80,85,75,85', 'Danza Acuática, A Bocajarro, Pájaro Osado, Danza Espada', true],
                    ['Pawmot', 923, 'Eléctrico/Lucha', '70,115,70,70,60,105', 'Plegaria Vital, Voltio Cruel, A Bocajarro, Sorpresa', true],
                    ['Grafaiai', 945, 'Veneno/Normal', '63,95,65,80,72,110', 'Mofa, Lanza Mugre, Desarme, Copión', false],
                    ['Gholdengo', 1000, 'Acero/Fantasma', '87,60,95,133,91,84', 'Fiebre Dorada, Bola Sombra, Maquinación, Recuperación', true],
                    ['Glimmora', 970, 'Roca/Veneno', '83,55,90,130,81,86', 'Bomba Lodo, Joya de Luz, Trampa Rocas, Tierra Viva', false],
                    ['Arboliva', 930, 'Planta/Normal', '78,69,90,125,109,39', 'Fuerza Lunar, Energibola, Tierra Viva, Gigadrenado', false]
                ]
            },
            'team-comp': {
				title: "🏆 TEAM COMPETITIVO", color: "var(--comp)",
				pokes: [
					['Koraidon', 1007, 'Lucha/Dragón', '100,135,115,85,100,135', 'Nitrochoque, Enfado, Envite Ígneo, Giro Vil', true],
					['Miraidon', 1008, 'Eléctrico/Dragón', '100,85,100,135,115,135', 'Electroderrape, Cometa Draco, Voltiocambio, Pulso Umbrío', true],
					['Melenaleteo', 987, 'Fantasma/Hada', '55,55,55,135,135,135', 'Bola Sombra, Brillo Mágico, Paz Mental, Mofa', true],
					['Ferropalmas', 992, 'Lucha/Eléctrico', '154,140,108,50,68,50', 'Puño Drenaje, Voltio Cruel, Sorpresa, Tambor', false],
					['Bramaluna', 1005, 'Dragón/Siniestro', '105,139,71,55,101,119', 'Acróbata, Danza Dragón, Triturar, Terremoto', true],
					['Ogerpon', 1017, 'Planta/Fuego', '80,120,84,60,96,110', 'Garrote Liana, Astas Drenaje, Danza Espada, Pataleta', true]
				]
			}
        };

        function render() {
            const wrapper = document.getElementById('teams-wrapper');
            wrapper.innerHTML = "";
            for (let id in paldeaData) {
                const team = paldeaData[id];
                let html = `<div class="team-section"><div class="team-title" style="color: ${team.color}; border-color: ${team.color}">${team.title}</div><div class="poke-grid">`;
                team.pokes.forEach(p => {
                    html += `
                    <div class="poke-card" onclick="openPoke('${p[0]}','${p[1]}','${p[2]}','${p[3]}','${p[4]}')">
                        ${p[5] ? '<div class="tera-badge">TERACRISTAL</div>' : ''}
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p[1]}.png">
                        <p style="font-weight:700; margin-top:10px; font-size:0.8rem">${p[0]}</p>
                    </div>`;
                });
                html += `</div></div>`;
                wrapper.innerHTML += html;
            }
        }

        function openPoke(nombre, id, tipo, stats, movs) {
            document.getElementById('modalName').innerText = nombre;
            document.getElementById('modalType').innerText = tipo;
            document.getElementById('modalImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
            const values = stats.split(',');
            const labels = ['PS', 'ATQ', 'DEF', 'SPA', 'SPD', 'VEL'];
            const statsDiv = document.getElementById('modalStats');
            statsDiv.innerHTML = "";
            values.forEach((v, i) => {
                statsDiv.innerHTML += `<div style="margin-bottom:8px">
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:700; color:#2f3542">
                    <span>${labels[i]}</span><span>${v}</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(v/180)*100}%"></div></div></div>`;
            });
            const movesDiv = document.getElementById('modalMoves');
            movesDiv.innerHTML = "";
            movs.split(',').forEach(m => { movesDiv.innerHTML += `<div class="move-box">💠 ${m.trim()}</div>`; });
            document.getElementById('pokeModal').style.display = "block";
            document.body.style.overflow = "hidden"; 
        }

        function closeModal() { document.getElementById('pokeModal').style.display = "none"; document.body.style.overflow = "auto"; }
        render();
    </script>
</body>
</html>
