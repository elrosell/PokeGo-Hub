<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fuego: #ff4757; --agua: #2e86de; --planta: #2ed573; --comp: #ffa502;
            --bg: #0a0a12; --card-bg: rgba(30, 41, 59, 0.7);
            --kanto-green: #9bbc0f; /* Color GameBoy */
        }

        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px;
            background-image: radial-gradient(circle at top right, #1e1e3f, #0a0a12);
            min-height: 100vh;
        }

        .header-area { text-align: center; margin-bottom: 50px; }
        .header-area h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 3rem; margin: 0;
            background: linear-gradient(to bottom, #fff 30%, #555 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }
        .header-area p { text-transform: uppercase; letter-spacing: 5px; color: var(--kanto-green); font-weight: bold; font-size: 0.8rem; }

        .team-section { 
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 30px; padding: 30px; margin-bottom: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .team-title { 
            font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 25px;
            display: flex; align-items: center; gap: 10px;
        }
        .team-title span { width: 40px; height: 4px; border-radius: 2px; }

        .poke-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; 
        }

        .poke-card {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
            position: relative; overflow: hidden;
        }
        .poke-card:hover { 
            transform: scale(1.05) translateY(-10px); 
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .poke-card img { width: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); z-index: 1; position: relative; }
        .poke-card p { font-weight: 700; margin-top: 10px; font-size: 0.9rem; letter-spacing: 1px; }

        /* Estilo Modal Re-imaginado */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
        }
        .modal-content {
            background: #111; color: white; margin: 5vh auto; padding: 40px; 
            width: 90%; max-width: 450px; border-radius: 40px; border: 1px solid #333;
            text-align: center; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        .close { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: #555; transition: 0.3s; }
        .close:hover { color: white; }

        .stat-bar-bg { background: #222; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; border: 1px solid #333; }
        .stat-bar-fill { background: linear-gradient(90deg, #fff, var(--kanto-green)); height: 100%; width: 0; transition: width 1s ease-out; }
        
        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .move-box { 
            background: #1a1a1a; padding: 12px; border-radius: 12px; font-size: 0.75rem; 
            border-left: 4px solid var(--kanto-green); font-weight: bold; text-transform: uppercase;
        }

        @media (max-width: 600px) { .poke-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="header-area">
        <p>Data Archives</p>
        <h1>REGION KANTO </h1>
    </div>

    <div id="wrapper"></div>

    <div id="pokeModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modalImg" style="width:180px; margin-top: -80px; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.8));">
            <h2 id="modalName" style="font-family: 'Orbitron'; font-size: 2rem; margin: 15px 0 5px 0;"></h2>
            <div id="modalType" style="font-weight: bold; color: var(--kanto-green); margin-bottom: 30px; font-size: 0.8rem; letter-spacing: 2px;"></div>
            
            <div id="modalStats" style="text-align: left;"></div>
            <div class="moves-grid" id="modalMoves"></div>
        </div>
    </div>

    <script>
        const kantoData = [
            { title: "TEAM CHARIZARD", color: "var(--fuego)", pokes: [
                ['Charizard', 6, 'FUEGO / VOLADOR', '78,84,78,109,85,100', 'Lanzallamas, Vuelo, Cuchillada, Giro Fuego'],
                ['Nidoking', 34, 'VENENO / TIERRA', '81,92,77,85,75,85', 'Terremoto, Rayo Hielo, Ventisca, Doble Patada'],
                ['Jolteon', 135, 'ELÉCTRICO', '65,65,60,110,95,130', 'Rayo, Onda Trueno, Pin Misil, Doble Patada'],
                ['Snorlax', 143, 'NORMAL', '160,110,65,65,110,30', 'Golpe Cuerpo, Hiperrayo, Surf, Descanso'],
                ['Lapras', 131, 'AGUA / HIELO', '130,85,80,85,95,60', 'Surf, Rayo Hielo, Psíquico, Rayo Confuso'],
                ['Alakazam', 65, 'PSÍQUICO', '55,50,45,135,95,120', 'Psíquico, Recuperación, Reflejo, Triataque']
            ]},
            { title: "TEAM BLASTOISE", color: "var(--agua)", pokes: [
                ['Blastoise', 9, 'AGUA', '79,83,100,85,105,78', 'Surf, Rayo Hielo, Mordisco, Cabezazo'],
                ['Arcanine', 59, 'FUEGO', '90,110,80,100,80,95', 'Lanzallamas, Vel. Extrema, Derribo, Rugido'],
                ['Exeggutor', 103, 'PLANTA / PSÍQ.', '95,95,85,125,65,55', 'Psíquico, Gigadrenado, Somnífero, Presa'],
                ['Raichu', 26, 'ELÉCTRICO', '60,90,55,90,80,100', 'Rayo, Onda Trueno, Portazo, Ataque Rápido'],
                ['Primeape', 57, 'LUCHA', '65,105,60,60,70,95', 'Tajo Cruzado, Karatazo, Furia, Chirrido'],
                ['Dodrio', 85, 'NORMAL / VOL.', '60,110,70,60,60,100', 'Pico Taladro, Triataque, Agilidad, Furia']
            ]},
            { title: "TEAM VENUSAUR", color: "var(--planta)", pokes: [
                ['Venusaur', 3, 'PLANTA / VENENO', '80,82,83,100,100,80', 'Rayo Solar, Hoja Afilada, Polvo Veneno, Somnífero'],
                ['Vaporeon', 134, 'AGUA', '130,65,60,110,95,65', 'Surf, Rayo Aurora, Niebla, Mordisco'],
                ['Magmar', 126, 'FUEGO', '65,95,57,100,85,93', 'Lanzallamas, Puño Fuego, Pantalla Humo, Rayo Confuso'],
                ['Magneton', 82, 'ELÉCT. / ACERO', '50,60,95,120,70,70', 'Rayo, Triataque, Onda Voltio, Chirrido'],
                ['Aerodactyl', 142, 'ROCA / VOLADOR', '80,105,65,60,75,130', 'Poder Pasado, Ataque Ala, Mordisco, Hiperrayo'],
                ['Dragonite', 149, 'DRAGÓN / VOLADOR', '91,134,95,100,100,80', 'Furia Dragón, Golpe Cuerpo, Ventisca, Agilidad']
            ]},
            { title: "TEAM COMPETITIVO", color: "var(--comp)", pokes: [
                ['Gengar', 94, 'FANT. / VENENO', '60,65,60,130,75,110', 'Tinieblas, Hipnosis, Come Sueños, Rayo Confuso'],
                ['Cloyster', 91, 'AGUA / HIELO', '50,95,180,85,45,70', 'Tenaza, Reflejo, Rayo Hielo, Pin Misil'],
                ['Machamp', 68, 'LUCHA', '90,130,80,65,85,55', 'Sumisión, Mov. Sísmico, Foco Energía, Fuerza'],
                ['Tauros', 128, 'NORMAL', '75,100,95,40,70,110', 'Derribo, Ventisca, Terremoto, Hiperrayo'],
                ['Rhydon', 112, 'TIERRA / ROCA', '105,130,120,45,45,40', 'Terremoto, Avalancha, Perforador, Pisotón'],
                ['Starmie', 121, 'AGUA / PSÍQ.', '60,75,85,100,85,115', 'Surf, Psíquico, Rayo, Recuperación']
            ]}
        ];

        function render() {
            const container = document.getElementById('wrapper');
            kantoData.forEach(team => {
                let html = `
                <div class="team-section">
                    <div class="team-title"><span style="background:${team.color}"></span> ${team.title}</div>
                    <div class="poke-grid">`;
                team.pokes.forEach(p => {
                    html += `
                    <div class="poke-card" onclick="openPoke('${p[0]}','${p[1]}','${p[2]}','${p[3]}','${p[4]}')">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p[1]}.png">
                        <p>${p[0]}</p>
                    </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function openPoke(nombre, id, tipo, stats, movs) {
            document.getElementById('modalName').innerText = nombre;
            document.getElementById('modalType').innerText = tipo;
            document.getElementById('modalImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
            
            const labels = ['HP', 'ATK', 'DEF', 'SPA', 'SPD', 'SPD'];
            const values = stats.split(',');
            const statsDiv = document.getElementById('modalStats');
            statsDiv.innerHTML = "";
            values.forEach((v, i) => {
                statsDiv.innerHTML += `
                    <div style="margin-bottom:10px">
                        <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:bold; letter-spacing:1px">
                            <span>${labels[i]}</span><span>${v}</span>
                        </div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(v/200)*100}%"></div></div>
                    </div>`;
            });

            const movesDiv = document.getElementById('modalMoves');
            movesDiv.innerHTML = "";
            movs.split(',').forEach(m => { movesDiv.innerHTML += `<div class="move-box">${m.trim()}</div>`; });

            document.getElementById('pokeModal').style.display = "block";
        }

        function closeModal() { document.getElementById('pokeModal').style.display = "none"; }
        render();
    </script>
</body>
</html>
