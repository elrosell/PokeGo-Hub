<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 90vh; }
        .hero { text-align: center; padding: 40px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); max-width: 600px; animation: fadeIn 1s ease; }
        h2 { color: #ff1f1f; font-size: 2.5rem; margin-bottom: 20px; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; }
        img { margin-top: 30px; filter: drop-shadow(0 0 10px #ff1f1f); animation: float 3s ease-in-out infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>
    <div class="hero">
        <h2>PokeMasters</h2>
        <p>Domina cada región con los equipos más equilibrados. Desde los clásicos iniciales hasta builds de alto rendimiento competitivo, Vamos y aprendamos de builds de pokemon!!.</p>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" width="220">
    </div>
</body>
</html>
